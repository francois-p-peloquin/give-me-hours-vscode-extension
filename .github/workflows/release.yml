# Publishes the extension to the VS Code Marketplace on every push to main.
#
# Version: patch by default; [minor] or [major] in the PR title bumps that instead.
# A version counts as released when its GitHub Release exists. This workflow creates it
# only after a successful publish, and it shows up immediately. (The Marketplace listing
# lags ~10 minutes, which made back-to-back merges reuse a version.) package.json is
# bumped only when its version is released. Otherwise (manual `npm version`, or a
# previous run that bumped but failed to publish) it's published as-is, so re-runs are
# safe and no version is skipped.
#
# Auth: Marketplace Trusted Publishing (GitHub OIDC), no stored token. The publisher's
# policy names this file, so renaming it breaks publishing until the policy is updated.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Marketplace Trusted Publishing (vsce --oidc)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Decide version
        id: version
        env:
          # The triggering commit, not the latest main (a queued run may check out a newer HEAD).
          TRIGGER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current=$(node -p "require('./package.json').version")
          tag="v$current"

          if gh release view "$tag" >/dev/null 2>&1; then
            message=$(git log -1 --format=%B "$TRIGGER_SHA")
            if grep -qi '\[major\]' <<<"$message"; then
              bump=major
            elif grep -qi '\[minor\]' <<<"$message"; then
              bump=minor
            else
              bump=patch
            fi
            echo "$current already released; bumping $bump."
            npm version "$bump" -m "%s [skip ci]"
          else
            # Not released yet: a manual `npm version`, a version edited in a PR, or a
            # previous run that bumped but failed to publish. Ship it from HEAD and
            # (re)point its tag here, since an unreleased tag never shipped anything.
            echo "$current has no GitHub Release yet; publishing it from HEAD."
            git tag -f -a "$tag" -m "$current"
          fi

          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: |
          git push origin HEAD:main
          git push --force origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Build webview
        run: yarn build

      - name: Package
        run: npx --yes @vscode/vsce@4 package -o "give-me-hours-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath "give-me-hours-${{ steps.version.outputs.version }}.vsix" --skip-duplicate

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: give-me-hours-${{ steps.version.outputs.version }}.vsix
          generate_release_notes: true
