# Publishes the extension to the VS Code Marketplace on every push to main.
#
# How the version is chosen:
#   - Normal merge: bumps the patch version (3.6.0 -> 3.6.1), commits, tags, publishes.
#   - PR title contains [minor] or [major]: bumps that instead
#     (e.g. "[major] Auto-publish on merge" -> 4.0.0). Works for merge and squash merges,
#     since both put the PR title in the commit message.
#   - Or locally: run `npm version minor` (or `major`), then `git push --follow-tags`.
#
# The Marketplace is the source of truth: the version in package.json is bumped
# only if it's already live there. If it isn't live yet (manual `npm version`, a
# version edited in a PR, or a previous run that bumped but failed to publish),
# it's published from HEAD as-is and its tag is moved to HEAD.
#
# Auth: Marketplace Trusted Publishing (GitHub OIDC), so there's no stored token.
# The publisher needs a Trusted Publishing policy for this repo + `release.yml`
# (marketplace.visualstudio.com/manage -> publisher -> Trusted Publishing).
# Renaming this file breaks publishing until the policy is updated.
#
# Re-running a failed run is safe: the bumped version isn't live, so a re-run
# publishes it without bumping again.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Marketplace Trusted Publishing (vsce --oidc)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Decide version
        id: version
        env:
          # The triggering commit, not the latest main (a queued run may check out a newer HEAD).
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current=$(node -p "require('./package.json').version")
          tag="v$current"
          ext=$(node -p "const p=require('./package.json'); p.publisher + '.' + p.name")

          # What's live on the Marketplace is the source of truth; git tags may be missing.
          published=$(npx --yes @vscode/vsce@4 show "$ext" --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).versions[0].version))')
          if [ -z "$published" ]; then
            echo "::error::Could not read the published version of $ext from the Marketplace."
            exit 1
          fi
          echo "package.json: $current, Marketplace: $published"

          if [ "$current" = "$published" ]; then
            message=$(git log -1 --format=%B "$TRIGGER_SHA")
            if grep -qi '\[major\]' <<<"$message"; then
              bump=major
            elif grep -qi '\[minor\]' <<<"$message"; then
              bump=minor
            else
              bump=patch
            fi
            echo "$current already released; bumping $bump."
            npm version "$bump" -m "%s [skip ci]"
          else
            # Not live yet: a manual `npm version`, a version edited in a PR, or a
            # previous run that bumped but failed to publish. Ship it from HEAD and
            # (re)point its tag here, since an unpublished tag never shipped anything.
            echo "$current is not on the Marketplace yet; publishing it from HEAD."
            git tag -f -a "$tag" -m "$current"
          fi

          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: |
          git push origin HEAD:main
          git push --force origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Build webview
        run: yarn build

      - name: Package
        run: npx --yes @vscode/vsce@4 package -o "give-me-hours-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath "give-me-hours-${{ steps.version.outputs.version }}.vsix" --skip-duplicate

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          file="give-me-hours-${{ steps.version.outputs.version }}.vsix"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --title "$tag" --generate-notes
          fi
